[workspace]
resolver = "3"
members = [
    "crates/nc-core",
    "crates/nc-render",
    "crates/nc-store",
    "crates/nc-app",
    "crates/nc-bench",
    "crates/spike-iced",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
nc-core = { path = "crates/nc-core" }
nc-render = { path = "crates/nc-render" }
nc-store = { path = "crates/nc-store" }
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
winit = "0.30"
pollster = "1"
tracy-client = "0.19"
serde = { version = "1", features = ["derive", "rc"] }
uuid = { version = "1", features = ["v4", "serde"] }
kurbo = "0.13"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
