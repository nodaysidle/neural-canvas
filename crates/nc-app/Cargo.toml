[package]
name = "neuralcanvas"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Tracy instrumentation for perf runs. Release builds never enable it.
profile = ["dep:tracy-client", "nc-render/profile"]

[dependencies]
tracy-client = { workspace = true, optional = true }
nc-core.workspace = true
nc-render.workspace = true
glam.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
nc-store.workspace = true
signal-hook = "0.4"
dirs = "7"
mundy = { version = "0.2", default-features = false, features = ["callback", "reduced-motion", "async-io"] }
nc-wayland.workspace = true
nc-export.workspace = true
wl-clipboard-rs = "0.9"
