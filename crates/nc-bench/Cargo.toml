[package]
name = "nc-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Measurement harness (S2k frame pacing, latency, tablet probe). Dev tool, never packaged."

[dependencies]
nc-core.workspace = true
nc-render.workspace = true
nc-store.workspace = true
nc-shell.workspace = true
uuid.workspace = true
glam.workspace = true
bytemuck.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
nc-wayland.workspace = true
wayland-client = "0.31"
serde_json = "1"
serde.workspace = true
kurbo.workspace = true
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"
nc-export.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
