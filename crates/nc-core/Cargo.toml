[package]
name = "nc-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glam.workspace = true
kurbo.workspace = true
serde.workspace = true
uuid.workspace = true
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
one-euro = "0.9"
rstar = "0.13"
postcard = { version = "1", default-features = false, features = ["use-std"] }
# Only to enable `std` for one-euro's nalgebra (f64 math); never used directly.
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
ramer_douglas_peucker = "0.2"
mint = "0.5"
# Style mirror: k-means palette in CIELAB.
kmeans_colors = { version = "0.7", default-features = false, features = ["palette_color"] }
palette = { version = "0.7", default-features = false, features = ["std"] }

[dev-dependencies]
proptest.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
